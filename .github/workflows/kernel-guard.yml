name: Kernel-Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
        
    - name: Initialize Brain
      run: python scripts/seed_db.py

    - name: Verify Kernel Roster
      run: python scripts/tests/verify_engine.py

    - name: Install engine dependencies
      run: pip install pyyaml==6.0.3 requests==2.34.2 python-dotenv==1.2.3 google-ads==31.4.0 pytest==9.0.3 pytest-cov==7.1.0

    - name: Unit tests (live ops safety paths)
      run: python -m pytest tests -q --cov=core/engine --cov-report=term

    - name: Smoke Test — proves the kernel actually runs, not just imports
      run: python scripts/smoke_test.py
