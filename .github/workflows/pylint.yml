name: Code-Quality-Guard

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint==4.1.3 pandas==3.0.5 streamlit==1.62.0 python-dotenv==1.2.3 google-ads==31.4.0 pyyaml==6.0.3 requests==2.34.2 pytest==9.0.3
    - name: Verify Code Quality
      run: |
        # This will now only fail if there are real Errors or Fatal crashes
        pylint $(git ls-files '*.py') --rcfile=.pylintrc
