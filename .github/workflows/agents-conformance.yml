name: Agent-Conformance

# Installs the real OpenCode and Codex CLIs and proves Foundry is discoverable in each.
# Nightly + manual, so upstream format changes fail loudly without blocking merges.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    - name: Install agent CLIs
      run: npm install -g opencode-ai @openai/codex
    - name: Install Foundry deps
      run: python -m pip install -r requirements.txt
    - name: Conformance (L0 discovery)
      run: python scripts/agent_conformance.py --require
