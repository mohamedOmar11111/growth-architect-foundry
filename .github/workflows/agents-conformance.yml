name: Agent-Conformance

# Installs the real OpenCode and Codex CLIs and proves Foundry is discoverable in each.
# Nightly + manual, so upstream format changes fail loudly without blocking merges.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    - name: Install agent CLIs
      run: npm install -g opencode-ai @openai/codex
    - name: Install Foundry deps
      run: python -m pip install -r requirements.txt
    - name: Conformance (L0 discovery)
      run: python scripts/agent_conformance.py --require
