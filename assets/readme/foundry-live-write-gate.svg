<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="foundry-live-write-gate-title foundry-live-write-gate-desc">
  <title id="foundry-live-write-gate-title">Foundry live-write gate</title>
  <desc id="foundry-live-write-gate-desc">Flowchart: a live pause or budget request is only applied when --confirm is given, the account data is fresh and within the 20 percent cap, and a human types the campaign key at a real terminal; an AI agent's shell has no terminal, so it is refused with exit 3.</desc>
  <defs>
    <marker id="foundry-live-write-gate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="foundry-live-write-gate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="940" fill="#f5f5f5"/>
  <g id="header">
    <text x="48" y="36" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">SAFETY</text>
    <text x="48" y="72" fill="#2d3142" font-size="28" font-family="Georgia, 'Times New Roman', serif">A live write needs a person</text>
    <text x="48" y="96" fill="#4f5d75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Four checks stand between an agent and your ad account. The last one cannot be scripted.</text>
  </g>
  <g id="connectors">
    <path d="M320,212 V252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <path d="M320,380 V420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <path d="M320,548 V588" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <path d="M320,716 V756" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <path d="M440,316 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <path d="M440,484 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <path d="M440,652 H640" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow-accent)"/>
  </g>
  <g id="labels">
    <rect x="332" y="388" width="40" height="24" rx="2" fill="#f5f5f5"/>
    <text x="352" y="406" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="332" y="556" width="40" height="24" rx="2" fill="#f5f5f5"/>
    <text x="352" y="574" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="332" y="724" width="40" height="24" rx="2" fill="#f5f5f5"/>
    <text x="352" y="742" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="516" y="288" width="48" height="20" rx="2" fill="#f5f5f5"/>
    <text x="540" y="302" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
    <rect x="516" y="456" width="48" height="20" rx="2" fill="#f5f5f5"/>
    <text x="540" y="470" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
    <rect x="516" y="624" width="48" height="20" rx="2" fill="#f5f5f5"/>
    <text x="540" y="638" fill="#eb6c36" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
  </g>
  <g id="nodes">
    <rect x="200" y="132" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="200" y="132" width="240" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.2"/>
    <text x="320" y="176" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Live write requested</text>
    <text x="320" y="200" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pause or budget</text>
    <polygon points="320,252 440,316 320,380 200,316" fill="#f5f5f5"/>
    <polygon points="320,252 440,316 320,380 200,316" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="320" y="311" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">--confirm</text>
    <text x="320" y="331" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">given?</text>
    <polygon points="320,420 440,484 320,548 200,484" fill="#f5f5f5"/>
    <polygon points="320,420 440,484 320,548 200,484" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="320" y="479" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Fresh data, within</text>
    <text x="320" y="499" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">20% cap?</text>
    <polygon points="320,588 440,652 320,716 200,652" fill="#f5f5f5"/>
    <polygon points="320,588 440,652 320,716 200,652" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="320" y="647" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Human types</text>
    <text x="320" y="667" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">the key?</text>
    <rect x="200" y="756" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="200" y="756" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="320" y="800" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Apply change</text>
    <text x="320" y="824" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ledger + log entry</text>
    <rect x="640" y="276" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="640" y="276" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="760" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Preview only</text>
    <text x="760" y="344" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">exit 0 · nothing changed</text>
    <rect x="640" y="444" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="640" y="444" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="760" y="488" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Blocked</text>
    <text x="760" y="512" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">exit 1 stale · exit 2 cap</text>
    <rect x="640" y="612" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="640" y="612" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="760" y="656" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Refused</text>
    <text x="760" y="680" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">exit 3 · no terminal</text>
    <text x="640" y="724" fill="#4f5d75" font-size="16" font-style="italic" font-family="Georgia, 'Times New Roman', serif">An AI agent's shell has no terminal,</text>
    <text x="640" y="748" fill="#4f5d75" font-size="16" font-style="italic" font-family="Georgia, 'Times New Roman', serif">so every agent ends up here.</text>
  </g>
  <g id="legend">
    <line x1="48" y1="860" x2="1152" y2="860" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="48" y="884" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
    <path d="M164,880 H200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-live-write-gate-arrow)"/>
    <text x="212" y="884" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">continues</text>
    <rect x="305" y="870" width="24" height="20" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="341" y="884" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the human check</text>
  </g>
</svg>
