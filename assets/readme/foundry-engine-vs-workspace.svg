<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="foundry-engine-vs-workspace-title foundry-engine-vs-workspace-desc">
  <title id="foundry-engine-vs-workspace-title">Foundry engine versus your workspace</title>
  <desc id="foundry-engine-vs-workspace-desc">The Foundry code is read-only and replaced on every plugin update; paths.py points all reports, logs and client folders at your own workspace, so updates never touch your data.</desc>
  <defs>
    <marker id="foundry-engine-vs-workspace-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="foundry-engine-vs-workspace-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f5f5f5"/>
  <g id="header">
    <text x="48" y="36" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LAYOUT</text>
    <text x="48" y="72" fill="#2d3142" font-size="28" font-family="Georgia, 'Times New Roman', serif">Code here, data there</text>
    <text x="48" y="96" fill="#4f5d75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Updating the plugin replaces the left side only. Your clients stay where they are.</text>
  </g>
  <g id="zones">
    <rect x="32" y="108" width="360" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
    <rect x="44" y="112" width="304" height="20" rx="2" fill="#f5f5f5"/>
    <text x="52" y="126" fill="rgba(45,49,66,0.55)" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.12em">FOUNDRY: READ-ONLY, REPLACED ON UPDATE</text>
    <rect x="808" y="108" width="360" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
    <rect x="820" y="112" width="268" height="20" rx="2" fill="#f5f5f5"/>
    <text x="828" y="126" fill="rgba(45,49,66,0.55)" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.12em">YOUR WORKSPACE: NEVER OVERWRITTEN</text>
  </g>
  <g id="connectors">
    <path d="M316,196 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-engine-vs-workspace-arrow)"/>
    <path d="M720,196 H868" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#foundry-engine-vs-workspace-arrow-accent)"/>
    <path d="M316,332 H868" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-engine-vs-workspace-arrow)"/>
  </g>
  <g id="labels">
    <rect x="376" y="168" width="48" height="20" rx="2" fill="#f5f5f5"/>
    <text x="400" y="182" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ASKS</text>
    <rect x="744" y="168" width="96" height="20" rx="2" fill="#f5f5f5"/>
    <text x="792" y="182" fill="#eb6c36" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES HERE</text>
    <rect x="520" y="304" width="140" height="20" rx="2" fill="#f5f5f5"/>
    <text x="590" y="318" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SETUP INIT COPIES</text>
  </g>
  <g id="nodes">
    <rect x="76" y="148" width="240" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="76" y="148" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="196" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Engine</text>
    <text x="196" y="208" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">foundry.py</text>
    <text x="196" y="226" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">core/engine</text>
    <rect x="76" y="284" width="240" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="76" y="284" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="196" y="328" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Tenant template</text>
    <text x="196" y="352" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Aurora_Skincare</text>
    <rect x="480" y="148" width="240" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="480" y="148" width="240" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="600" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">paths.py</text>
    <text x="600" y="208" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FOUNDRY_WORKSPACE</text>
    <text x="600" y="226" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">or current folder</text>
    <rect x="868" y="148" width="240" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="868" y="148" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="988" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Reports and log</text>
    <text x="988" y="208" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">04_Reports, log.md</text>
    <text x="988" y="226" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">budget ledger</text>
    <rect x="868" y="284" width="240" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="868" y="284" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="988" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Client folders</text>
    <text x="988" y="344" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">STRATEGY.md, .env 0600</text>
    <text x="988" y="362" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">signals, tasks</text>
  </g>
  <text x="48" y="452" fill="#4f5d75" font-size="16" font-style="italic" font-family="Georgia, 'Times New Roman', serif">One resolver decides where data lives, so no other file can write into the plugin folder.</text>
  <g id="legend">
    <line x1="48" y1="480" x2="1152" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="48" y="504" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
    <path d="M164,500 H200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-engine-vs-workspace-arrow)"/>
    <text x="212" y="504" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">reads or writes</text>
    <rect x="346" y="490" width="24" height="20" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="382" y="504" fill="#4f5d75" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">decides where data lives</text>
  </g>
</svg>
