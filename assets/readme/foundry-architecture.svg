    <rect x="640" y="420" width="200" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="740" y="456" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Human gate</text>
    <text x="740" y="480" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">you type the key</text>
    <text x="740" y="498" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">at a real terminal</text>
    <rect x="936" y="148" width="200" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="936" y="148" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="1036" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Your workspace</text>
    <text x="1036" y="208" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tenants, reports</text>
    <text x="1036" y="226" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">log, ledger</text>
    <rect x="936" y="420" width="200" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="936" y="420" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.45)" stroke-width="1.2"/>
    <text x="1036" y="464" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Google + Meta</text>
    <text x="1036" y="488" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ad accounts</text>
  </g>
  <g id="legend">
    <line x1="48" y1="564" x2="1152" y2="564" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
