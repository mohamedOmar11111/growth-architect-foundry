    <rect x="48" y="420" width="200" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="148" y="456" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ChatGPT GPT</text>
    <text x="148" y="480" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Code Interpreter</text>
    <text x="148" y="498" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">no network</text>
    <rect x="344" y="148" width="200" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="344" y="148" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="444" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Skill + AGENTS.md</text>
    <text x="444" y="208" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rules every agent</text>
    <text x="444" y="226" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">must follow</text>
    <rect x="344" y="284" width="200" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="344" y="284" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="444" y="328" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">foundry.py</text>
    <text x="444" y="352" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">exit 0/1/2/3</text>
    <rect x="640" y="284" width="200" height="96" rx="6" fill="#f5f5f5"/>
    <rect x="640" y="284" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="740" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Command engine</text>
    <text x="740" y="344" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">audit, diagnose, report</text>
    <text x="740" y="362" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">economics, live</text>
