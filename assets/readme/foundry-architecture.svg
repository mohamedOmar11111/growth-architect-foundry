<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="foundry-architecture-title foundry-architecture-desc">
  <title id="foundry-architecture-title">Foundry architecture: one engine, every agent</title>
  <desc id="foundry-architecture-desc">Coding agents read the Foundry rules and run foundry.py; the command engine writes reports to your workspace, and a live ad-account change needs a human to type the campaign key at a terminal.</desc>
  <defs>
    <marker id="foundry-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="foundry-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#f5f5f5"/>
  <g id="header">
    <text x="48" y="36" fill="#4f5d75" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">ARCHITECTURE</text>
    <text x="48" y="72" fill="#2d3142" font-size="28" font-family="Georgia, 'Times New Roman', serif">One engine, every agent</text>
    <text x="48" y="96" fill="#4f5d75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Agents read the rules, run foundry.py, and only a human can approve a live write.</text>
  </g>
  <g id="zones">
    <rect x="32" y="108" width="232" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
    <rect x="44" y="112" width="92" height="20" rx="2" fill="#f5f5f5"/>
    <text x="52" y="126" fill="rgba(45,49,66,0.55)" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.12em">YOUR AGENT</text>
    <rect x="328" y="108" width="528" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
    <rect x="340" y="112" width="200" height="20" rx="2" fill="#f5f5f5"/>
    <text x="348" y="126" fill="rgba(45,49,66,0.55)" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.12em">FOUNDRY (READ-ONLY CODE)</text>
    <rect x="920" y="108" width="232" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
    <rect x="932" y="112" width="168" height="20" rx="2" fill="#f5f5f5"/>
    <text x="940" y="126" fill="rgba(45,49,66,0.55)" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.12em">YOUR DATA + ACCOUNTS</text>
  </g>
  <g id="connectors">
    <path d="M148,284 V204 Q148,196 156,196 H344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow)"/>
    <path d="M248,332 H344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow)"/>
    <path d="M248,468 H436 Q444,468 444,460 V380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow)"/>
    <path d="M544,332 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow)"/>
    <path d="M840,308 H880 Q888,308 888,300 V204 Q888,196 896,196 H936" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow)"/>
    <path d="M740,380 V420" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow-accent)"/>
    <path d="M840,468 H936" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#foundry-architecture-arrow-accent)"/>
    <path d="M840,356 H1028 Q1036,356 1036,364 V420" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#foundry-architecture-arrow)"/>
  </g>
  <g id="labels">
    <rect x="224" y="168" width="56" height="20" rx="2" fill="#f5f5f5"/>
    <text x="252" y="182" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
