    <rect x="296" y="440" width="96" height="20" rx="2" fill="#f5f5f5"/>
    <text x="344" y="454" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">OFFLINE COPY</text>
    <rect x="560" y="304" width="64" height="20" rx="2" fill="#f5f5f5"/>
    <text x="592" y="318" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">--JSON</text>
    <rect x="752" y="388" width="88" height="24" rx="2" fill="#f5f5f5"/>
    <text x="796" y="406" fill="#eb6c36" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">LIVE WRITE</text>
    <rect x="848" y="440" width="80" height="20" rx="2" fill="#f5f5f5"/>
    <text x="888" y="454" fill="#eb6c36" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TYPED KEY</text>
    <rect x="900" y="252" width="104" height="24" rx="2" fill="#f5f5f5"/>
    <text x="952" y="270" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REPORTS, LOG</text>
    <rect x="868" y="328" width="120" height="20" rx="2" fill="#f5f5f5"/>
    <text x="928" y="342" fill="#7a8399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY PULL</text>
  </g>
